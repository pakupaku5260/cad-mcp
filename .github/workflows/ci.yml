name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  offline:
    name: Offline checks
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package + dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff
        run: ruff check .

      - name: Pytest (offline)
        env:
          PYTHONPATH: "."
        run: pytest -q -m "not sw"

      - name: Tool inventory check
        env:
          PYTHONPATH: "."
        run: python scripts/tool_inventory.py --check
