# cadmcp public site (MkDocs Material). Source: website/docs — not repo docs/.
site_name: cadmcp
site_description: Bridging AI and CAD.
site_author: cadmcp
site_url: https://cad.npanic.com/

repo_url: https://github.com/pakupaku5260/cad-mcp
repo_name: pakupaku5260/cad-mcp
edit_uri: ""

docs_dir: website/docs
site_dir: website/site
exclude_docs: |
  _generated/*

theme:
  name: material
  custom_dir: website/overrides
  favicon: assets/images/favicon.png
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue grey
      accent: teal
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue grey
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  # Fonts are self-hosted: see stylesheets/fonts.css.
  font: false
  features:
    - navigation.sections
    - navigation.top
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
  icon:
    repo: fontawesome/brands/github

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.snippets:
      base_path: ["website/docs"]
      check_paths: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra_css:
  - stylesheets/fonts.css
  - stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/pakupaku5260/cad-mcp
  generator: false

copyright: >
  MIT License · Independent project, not affiliated with Dassault Systèmes ·
  SOLIDWORKS® is a registered trademark of Dassault Systèmes SolidWorks Corporation.

nav:
  - Start:
      - Home: index.md
      - Getting started: getting-started.md
  - Reference:
      - Tools: tools.md
      - Architecture: architecture.md
  - Help:
      - FAQ: faq.md
      - Troubleshooting: troubleshooting.md
      - Limitations: limitations.md
      - Legal: legal.md
