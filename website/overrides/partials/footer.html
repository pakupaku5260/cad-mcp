{#- Single-tone site footer — same column as top bar / article -#}
<footer class="cmdx-footer">
  <div class="cmdx-shell cmdx-footer__inner">
    <p class="cmdx-footer__copy">
      {% if config.copyright %}{{ config.copyright }}{% endif %}
    </p>
    {% if config.repo_url %}
    <a
      class="cmdx-footer__github"
      href="{{ config.repo_url }}"
      target="_blank"
      rel="noopener"
      title="GitHub"
      aria-label="GitHub"
    >
      {% include ".icons/fontawesome/brands/github.svg" %}
    </a>
    {% endif %}
  </div>
</footer>
