[project]
name = "pycadmcp"
version = "0.1.0"
description = "CAD MCP server: one process, dedicated STA executor, offline-testable (SolidWorks backend first)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [
    { name = "pakupaku5260", email = "pakupaku5260@gmail.com" },
]
keywords = ["mcp", "cad", "solidworks", "sta", "com"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]
urls = { Homepage = "https://github.com/pakupaku5260/cad-mcp", Repository = "https://github.com/pakupaku5260/cad-mcp.git", Issues = "https://github.com/pakupaku5260/cad-mcp/issues" }
dependencies = [
    "jsonschema>=4.26.0",
    "mcp>=2.3.0",
    "pydantic>=2.14.1",
    "pywin32>=312 ; sys_platform == 'win32'",
    "starlette>=0.48",
    "uvicorn>=0.34",
]

[project.scripts]
cadmcp = "cadmcp.cli:main"

[project.optional-dependencies]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "PyYAML>=6.0",
    "ruff>=0.17.1",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "PyYAML>=6.0",
    "ruff>=0.17.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cadmcp"]

# skill 已在 packages 内；勿 force-include 以免重复打包
# 证据/基线已迁出至 internal-evidence/（gitignore），不再进入 wheel

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-m 'not sw'"  # Real SW tests off by default; pass `-m sw` to enable (last -m wins)
markers = [
    "sw: integration tests requiring real SolidWorks (skipped by default; use -m sw to enable)",
]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".refs", ".venv"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
